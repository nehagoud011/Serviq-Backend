spring.application.name=Seviqq
server.port=${PORT:8080}

# Database Configuration:
# 1. In Cloud (Render/Railway), if SPRING_DATASOURCE_URL or MYSQL_URL is provided, it connects to your MySQL database.
# 2. If no cloud database is specified, it gracefully falls back to an embedded persistent H2 database so the app runs smoothly out of the box!
spring.datasource.url=${SPRING_DATASOURCE_URL:${MYSQL_URL:jdbc:h2:file:./data/serviqdb;DB_CLOSE_DELAY=-1;MODE=MySQL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:${MYSQL_USER:sa}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:${MYSQL_PASSWORD:}}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true